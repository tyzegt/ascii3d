    <script>
    (function () {
        'use strict';

        var Vec3 = A3D.modules.Vec3;
        var Mat4 = A3D.modules.Mat4;
        var Camera = A3D.modules.Camera;
        var Scene = A3D.modules.Scene;
        var Cube = A3D.modules.Cube;
        var Plane = A3D.modules.Plane;
        var Pyramid = A3D.modules.Pyramid;
        var FrameBuffer = A3D.modules.FrameBuffer;
        var Projection = A3D.modules.Projection;
        var Rasterizer = A3D.modules.Rasterizer;
        var Lighting = A3D.modules.Lighting;
        var Texture = A3D.modules.Texture;
        var Config = A3D.modules.Config;

        var output = document.getElementById('output');
        var passed = 0;
        var failed = 0;
        var currentSection = '';

        function section(name) {
            currentSection = name;
            var div = document.createElement('div');
            div.className = 'section';
            div.textContent = '— ' + name + ' —';
            output.appendChild(div);
        }

        function report(label, ok, actual, expected) {
            var line = document.createElement('div');
            if (ok) {
                passed++;
                line.className = 'pass';
                line.textContent = 'PASS  ' + currentSection + ': ' + label;
            } else {
                failed++;
                line.className = 'fail';
                var msg = 'FAIL  ' + currentSection + ': ' + label;
                if (actual !== undefined) msg += '  actual=' + actual;
                if (expected !== undefined) msg += '  expected=' + expected;
                line.textContent = msg;
            }
            output.appendChild(line);
            if (!ok) console.error('FAIL', currentSection, label, { actual: actual, expected: expected });
        }

        function assertTrue(label, cond, detail) { report(label, !!cond, detail); }
        function assertClose(label, a, e, eps) { if (eps === undefined) eps = 1e-4; report(label, Math.abs(a - e) <= eps, a, e); }

        // Camera at origin looking down -z with identity orientation.
        function makeTestCamera() {
            var cam = new Camera();
            cam.position = new Vec3(0, 0, 5);
            cam.yaw = 0;
            cam.pitch = 0;
            cam.aspect = 1;
            return cam;
        }

        // ---------- Near clipping (Sutherland-Hodgman) ----------
        // Convention: camera looks down -z, so a point is IN FRONT when z < 0.
        // clipNear(verts, near) keeps the region z <= -near.
        function testClipNear() {
            section('Projection.clipNear');

            var near = 1.0;

            // fully in front (z negative) -> unchanged count
            var allIn = [
                { x: 0, y: 0, z: -2 },
                { x: 1, y: 0, z: -3 },
                { x: 0, y: 1, z: -4 }
            ];
            var r1 = Projection.clipNear(allIn, near);
            assertTrue('all-in polygon kept (3 verts)', r1 && r1.length === 3, 'got ' + (r1 && r1.length));

            // fully behind (z positive) -> null
            var allBehind = [
                { x: 0, y: 0, z: 2 },
                { x: 1, y: 0, z: 3 },
                { x: 0, y: 1, z: 4 }
            ];
            var r2 = Projection.clipNear(allBehind, near);
            assertTrue('all-behind polygon -> null', r2 === null);

            // one vertex behind (z positive) -> clipped to quad (4 verts), all z <= -near
            var mixed = [
                { x: 0, y: 0, z: -2 },
                { x: 1, y: 0, z: 3 },    // behind
                { x: 0, y: 1, z: -4 }
            ];
            var r3 = Projection.clipNear(mixed, near);
            assertTrue('one-behind -> quad (4 verts)', r3 && r3.length === 4, 'got ' + (r3 && r3.length));
            if (r3) {
                var allZ = true;
                for (var i = 0; i < r3.length; i++) {
                    if (r3[i].z > -near + 1e-6) allZ = false;
                }
                assertTrue('all clipped verts z <= -near', allZ);
            }

            // two vertices behind -> triangle (3 verts)
            var twoBehind = [
                { x: 0, y: 0, z: -2 },
                { x: 1, y: 0, z: 3 },
                { x: 0, y: 1, z: 4 }
            ];
            var r4 = Projection.clipNear(twoBehind, near);
            assertTrue('two-behind -> triangle (3 verts)', r4 && r4.length === 3, 'got ' + (r4 && r4.length));

            // interpolation correctness: edge from z=-2 to z=2 crossing z=-1
            var tri = [
                { x: 0, y: 0, z: -2 },
                { x: 10, y: 0, z: 2 },
                { x: 5, y: 5, z: -10 }
            ];
            var r5 = Projection.clipNear(tri, near);
            if (r5) {
                // crossing at z=-1: t = (-1 - (-2)) / (2 - (-2)) = 1/4 -> x = 0 + 10*0.25 = 2.5
                var found = null;
                for (var k = 0; k < r5.length; k++) {
                    if (Math.abs(r5[k].z - (-near)) < 1e-6 && Math.abs(r5[k].x - 2.5) < 1e-6) {
                        found = r5[k];
                    }
                }
                assertTrue('clip interpolation exact (x=2.5 at z=-near)', !!found, 'verts: ' + JSON.stringify(r5.map(function(v){return [v.x,v.z];})));
            } else {
                assertTrue('clip interpolation exact (x=2.5 at z=-near)', false, 'no result');
            }

            // UV preservation through clip: vertices carry u/v; the interpolated
            // clip vertex must have u/v linearly blended in camera space.
            var uvTri = [
                { x: 0, y: 0, z: -2, u: 0, v: 0 },
                { x: 10, y: 0, z: 2, u: 1, v: 0.5 },   // behind -> clipped
                { x: 5, y: 5, z: -10, u: 0.5, v: 1 }
            ];
            var rUV = Projection.clipNear(uvTri, near);
            assertTrue('clipNear keeps vert count with UV (4 verts)', rUV && rUV.length === 4, 'got ' + (rUV && rUV.length));
            if (rUV) {
                // the interpolated vertex sits at z=-near; its u/v must equal the
                // linear blend of the two edge endpoints at t=0.25 (same as x test).
                var clipVert = null;
                for (var uvI = 0; uvI < rUV.length; uvI++) {
                    if (Math.abs(rUV[uvI].z - (-near)) < 1e-6) {
                        // only the interpolated one has z exactly at -near AND x=2.5
                        if (Math.abs(rUV[uvI].x - 2.5) < 1e-6) clipVert = rUV[uvI];
                    }
                }
                assertTrue('clipped vertex exists with exact z', !!clipVert);
                if (clipVert) {
                    // u: lerp(0 -> 1, t=0.25) = 0.25 ; v: lerp(0 -> 0.5, t=0.25) = 0.125
                    assertClose('clipped vertex u interpolated', clipVert.u, 0.25, 1e-4);
                    assertClose('clipped vertex v interpolated', clipVert.v, 0.125, 1e-4);
                }
            }
        }

        // ---------- projectFace ----------
        function testProjectFace() {
            section('Projection.projectFace');

            var cam = makeTestCamera();
            var view = cam.getViewMatrix();
            var proj = cam.getProjectionMatrix();
            var W = 100, H = 50, aspect = 2.0; // cellH/cellW

            // A triangle facing the camera. Camera at (0,0,5) looks down -z.
            // A face at z=0 with normal pointing +z (towards the camera) is visible.
            var tri = [new Vec3(-1, -1, 0), new Vec3(1, -1, 0), new Vec3(0, 1, 0)];
            // normal: (v1-v0)x(v2-v0) = (2,0,0)x(1,2,0) = (0*0-0*2, 0*1-2*0, 2*2-0*1)=(0,0,4)->normalize (0,0,1)
            var normalWorld = new Vec3(0, 0, 1);
            var normalCam = Projection.normalToCamera(normalWorld, view);

            var r = Projection.projectFace(tri, null, normalCam, view, proj, W, H, aspect);
            assertTrue('front-facing face projects', !!r);
            if (r) {
                assertTrue('projected 3 points', r.pts.length === 3);
                // center of triangle should project near screen center (x=50)
                var avgX = (r.pts[0].x + r.pts[1].x + r.pts[2].x) / 3;
                assertClose('centroid x near center', avgX, W / 2, W * 0.1);
                // all invW positive
                var okW = true;
                for (var i = 0; i < r.pts.length; i++) {
                    if (r.pts[i].invW <= 0) okW = false;
                }
                assertTrue('all invW > 0', okW);

                // back-face cull: same triangle but normal flipped -> culled
                var rBack = Projection.projectFace(tri, null, new Vec3(-normalCam.x, -normalCam.y, -normalCam.z), view, proj, W, H, aspect);
                assertTrue('back-facing face culled', rBack === null);
            }

            // Face behind the camera -> clipped to null
            var behind = [new Vec3(-1, -1, 8), new Vec3(1, -1, 8), new Vec3(0, 1, 8)];
            var nBehind = Projection.normalToCamera(new Vec3(0, 0, 1), view);
            var rBehind = Projection.projectFace(behind, null, nBehind, view, proj, W, H, aspect);
            assertTrue('face behind camera -> null', rBehind === null);

            // Normal transform: camera at (0,0,5) looking to origin has identity
            // rotation (forward = world -z). So a world normal is unchanged in
            // camera space: world (0,0,1) -> cam (0,0,1).
            assertClose('normalToCamera x', normalCam.x, 0, 1e-5);
            assertClose('normalToCamera y', normalCam.y, 0, 1e-5);
            assertClose('normalToCamera z', normalCam.z, 1, 1e-5);

            // projectFace with uvs: each output pt must carry the face-corner UV.
            var triUV = [new Vec3(-1, -1, 0), new Vec3(1, -1, 0), new Vec3(0, 1, 0)];
            var uvArr = [0, 0,   1, 0,   0.5, 1];  // per-corner (u,v)
            var rUVFace = Projection.projectFace(triUV, uvArr, normalCam, view, proj, W, H, aspect);
            assertTrue('projectFace with uvs projects', !!rUVFace);
            if (rUVFace && rUVFace.pts.length === 3) {
                // no clipping here (all z=0 in front), so pt.u/v == input uv order
                assertClose('pt[0].u', rUVFace.pts[0].u, 0, 1e-5);
                assertClose('pt[0].v', rUVFace.pts[0].v, 0, 1e-5);
                assertClose('pt[1].u', rUVFace.pts[1].u, 1, 1e-5);
                assertClose('pt[1].v', rUVFace.pts[1].v, 0, 1e-5);
                assertClose('pt[2].u', rUVFace.pts[2].u, 0.5, 1e-5);
                assertClose('pt[2].v', rUVFace.pts[2].v, 1, 1e-5);
            } else {
                assertTrue('projectFace with uvs: 3 pts', false, 'got ' + (rUVFace && rUVFace.pts.length));
            }

            // projectFace WITHOUT uvs: pts still have u/v fields (default 0) —
            // backward compatible, existing callers unaffected.
            var rNoUV = Projection.projectFace(tri, null, normalCam, view, proj, W, H, aspect);
            assertTrue('projectFace without uvs still works', !!rNoUV && rNoUV.pts.length === 3);
            if (rNoUV) {
                assertClose('pt.u defaults to 0 (no uvs)', rNoUV.pts[0].u, 0, 1e-9);
                assertClose('pt.v defaults to 0 (no uvs)', rNoUV.pts[0].v, 0, 1e-9);
            }
        }

        // ---------- projectEdge ----------
        function testProjectEdge() {
            section('Projection.projectEdge');

            var cam = makeTestCamera();
            var view = cam.getViewMatrix();
            var proj = cam.getProjectionMatrix();
            var W = 100, H = 50, aspect = 2.0;

            // visible edge (z=0 is in front of camera at z=5)
            var e1 = Projection.projectEdge(new Vec3(-1, 0, 0), new Vec3(1, 0, 0), view, proj, W, H, aspect);
            assertTrue('visible edge projects', !!e1 && e1.length === 2);
            if (e1) {
                assertTrue('edge invW > 0', e1[0].invW > 0 && e1[1].invW > 0);
            }

            // both endpoints behind camera (z=8 > camera z=5) -> null
            var e2 = Projection.projectEdge(new Vec3(-1, 0, 8), new Vec3(1, 0, 8), view, proj, W, H, aspect);
            assertTrue('edge behind camera -> null', e2 === null);

            // one endpoint in front (z=-1), one behind (z=8) -> clipped, returns 2 pts
            var e3 = Projection.projectEdge(new Vec3(-1, 0, -1), new Vec3(1, 0, 8), view, proj, W, H, aspect);
            assertTrue('edge crossing near plane clips', !!e3 && e3.length === 2);
        }

        // ---------- Rasterizer: fillPoly + z-buffer ----------
        function testRasterizer() {
            section('Rasterizer.fillPoly / z-buffer');

            var fb = new FrameBuffer();
            fb.resize(40, 20);
            fb.clear();

            // A triangle covering the center of the buffer.
            var pts = [
                { x: 10, y: 5, invW: 0.2 },
                { x: 30, y: 5, invW: 0.2 },
                { x: 20, y: 15, invW: 0.2 }
            ];
            Rasterizer.fillPoly(fb, pts, '#');

            // center cell should be filled
            assertTrue('center cell filled', fb.getChar(20, 10) === '#', 'got ' + JSON.stringify(fb.getChar(20, 10)));
            // a corner outside the triangle should be empty
            assertTrue('outside cell empty', fb.getChar(2, 2) === ' ');

            // Depth convention: w = -z_cam (camera looks down -z). CLOSER objects
            // have SMALLER w and therefore LARGER 1/w (invW). The z-buffer keeps
            // the LARGEST invW. So a "near" polygon has a larger invW value.
            var ptsNear = [
                { x: 15, y: 8, invW: 0.5 },   // larger 1/w = closer
                { x: 25, y: 8, invW: 0.5 },
                { x: 20, y: 12, invW: 0.5 }
            ];
            Rasterizer.fillPoly(fb, ptsNear, '@');
            // center is inside the near polygon; it should win
            assertTrue('closer polygon wins z-buffer', fb.getChar(20, 10) === '@', 'got ' + JSON.stringify(fb.getChar(20, 10)));

            // a farther polygon (smaller invW) must NOT overwrite
            var ptsFar = [
                { x: 18, y: 9, invW: 0.1 },
                { x: 22, y: 9, invW: 0.1 },
                { x: 20, y: 11, invW: 0.1 }
            ];
            Rasterizer.fillPoly(fb, ptsFar, '+');
            assertTrue('farther polygon rejected by z-buffer', fb.getChar(20, 10) === '@', 'got ' + JSON.stringify(fb.getChar(20, 10)));

            // perspective-correct interpolation: invW should be lower at the far edge
            var grad = Rasterizer.computeInvWGradient(pts);
            assertTrue('invW gradient computed', isFinite(grad.A) && isFinite(grad.B) && isFinite(grad.C));

            // ---------- per-cell color (setCellColor / flush) ----------
            var fbC = new FrameBuffer();
            fbC.resize(20, 10);
            fbC.clear();
            // write a colored cell; z-test should accept it (depth > 0)
            fbC.setCellColor(5, 5, '#', 0.5, 0, 1, 0, 0);   // red
            assertTrue('setCellColor writes glyph', fbC.getChar(5, 5) === '#');
            assertClose('setCellColor stores r=255', fbC.r[5 * 20 + 5], 255, 0.5);
            assertClose('setCellColor stores g=0', fbC.g[5 * 20 + 5], 0, 0.5);
            assertClose('setCellColor stores b=0', fbC.b[5 * 20 + 5], 0, 0.5);
            // a farther (smaller invW) write must NOT overwrite the color
            fbC.setCellColor(5, 5, '@', 0.1, 0, 0, 1, 1);   // cyan, but rejected
            assertTrue('farther setCellColor rejected by z-buffer', fbC.getChar(5, 5) === '#');
            assertClose('rejected write did not change r', fbC.r[5 * 20 + 5], 255, 0.5);
            // a closer (larger invW) write wins and updates color
            fbC.setCellColor(5, 5, '@', 0.9, 0, 0, 1, 0);   // green, wins
            assertTrue('closer setCellColor wins', fbC.getChar(5, 5) === '@');
            assertClose('winning write r=0', fbC.r[5 * 20 + 5], 0, 0.5);
            assertClose('winning write g=255', fbC.g[5 * 20 + 5], 255, 0.5);

            // clear() resets color back to neutral white
            fbC.clear();
            assertTrue('clear resets glyph', fbC.getChar(5, 5) === ' ');
            assertClose('clear resets r to 255', fbC.r[5 * 20 + 5], 255, 0.5);

            // flush with per-cell color groups runs by (glyph,color): a row with
            // two different colors must produce two separate fillText calls with
            // distinct fillStyle values. We spy on ctx to capture fillStyle.
            var fbF = new FrameBuffer();
            fbF.resize(10, 1);
            fbF.clear();
            fbF.setCellColor(0, 0, 'a', 1, 0, 1, 0, 0);   // red
            fbF.setCellColor(1, 0, 'a', 1, 0, 0, 1, 0);   // green (same glyph, diff color)
            var styles = [];
            var spyCtx = {
                font: '', textBaseline: '', fillStyle: '',
                fillText: function (txt, x, y) { styles.push(this.fillStyle + '|' + txt); }
            };
            fbF.flush(spyCtx, 10, 20, null);
            // expect two runs: red 'a' then green 'a'
            assertTrue('flush splits by color (2 runs)', styles.length === 2, 'got ' + JSON.stringify(styles));
            if (styles.length === 2) {
                assertTrue('first run is red', /rgb\(255,0,0\)/.test(styles[0]), styles[0]);
                assertTrue('second run is green', /rgb\(0,255,0\)/.test(styles[1]), styles[1]);
            }

            // flush with same color + same glyph merges into one run
            var fbF2 = new FrameBuffer();
            fbF2.resize(10, 1);
            fbF2.clear();
            fbF2.setCellColor(0, 0, 'a', 1, 0, 1, 0, 0);
            fbF2.setCellColor(1, 0, 'a', 1, 0, 1, 0, 0);   // same red
            var styles2 = [];
            var spyCtx2 = {
                font: '', textBaseline: '', fillStyle: '',
                fillText: function (txt) { styles2.push(this.fillStyle + '|' + txt); }
            };
            fbF2.flush(spyCtx2, 10, 20, null);
            assertTrue('flush merges same (glyph,color) into 1 run', styles2.length === 1, 'got ' + JSON.stringify(styles2));

            // ---------- perspective-correct UV gradients (u/w, v/w) ----------
            // A triangle in screen space with varying invW and per-corner UVs.
            var uvPts = [
                { x: 10, y: 5,  invW: 0.2, u: 0,   v: 0 },
                { x: 30, y: 5,  invW: 0.4, u: 1,   v: 0 },
                { x: 20, y: 15, invW: 0.6, u: 0.5, v: 1 }
            ];
            var uvArr2 = [0, 0,   1, 0,   0.5, 1];
            var grads = Rasterizer.buildUVGradients(uvPts, uvArr2);
            assertTrue('buildUVGradients returns uw & vw', !!grads && !!grads.uw && !!grads.vw);
            if (grads) {
                // at each vertex, sampleUV must recover the exact corner u/v.
                var invWGrad = Rasterizer.computeInvWGradient(uvPts);
                for (var vi2 = 0; vi2 < 3; vi2++) {
                    var p = uvPts[vi2];
                    var sampled = Rasterizer.sampleUV(grads, invWGrad, p.x, p.y);
                    assertTrue('sampleUV at vertex ' + vi2 + ' not null', !!sampled);
                    if (sampled) {
                        assertClose('sampleUV u at vertex ' + vi2, sampled.u, uvArr2[vi2 * 2], 1e-3);
                        assertClose('sampleUV v at vertex ' + vi2, sampled.v, uvArr2[vi2 * 2 + 1], 1e-3);
                    }
                }
                // perspective check: the barycentric center of the triangle should
                // give a u/v that is NOT the naive screen-space average — i.e. the
                // 1/w weighting matters. We just assert it's finite and in [0,1].
                var cxp = (uvPts[0].x + uvPts[1].x + uvPts[2].x) / 3;
                var cyp = (uvPts[0].y + uvPts[1].y + uvPts[2].y) / 3;
                var centerUV = Rasterizer.sampleUV(grads, invWGrad, cxp, cyp);
                assertTrue('sampleUV at centroid finite', !!centerUV && isFinite(centerUV.u) && isFinite(centerUV.v));
                if (centerUV) {
                    assertTrue('centroid u in [0,1]', centerUV.u >= -1e-3 && centerUV.u <= 1 + 1e-3, 'u=' + centerUV.u);
                    assertTrue('centroid v in [0,1]', centerUV.v >= -1e-3 && centerUV.v <= 1 + 1e-3, 'v=' + centerUV.v);
                }
            }

            // fillPoly with uvs must not change the rasterized glyph/depth (stage A:
            // no visual regression) — same output as without uvs.
            var fbA = new FrameBuffer(); fbA.resize(40, 20); fbA.clear();
            var fbB = new FrameBuffer(); fbB.resize(40, 20); fbB.clear();
            Rasterizer.fillPoly(fbA, uvPts, '#');
            Rasterizer.fillPoly(fbB, uvPts, '#', 0, uvArr2);
            var sameOut = true;
            for (var ci = 0; ci < fbA.chars.length; ci++) {
                if (fbA.chars[ci] !== fbB.chars[ci]) { sameOut = false; break; }
            }
            assertTrue('fillPoly with uvs: identical glyph output (no regression)', sameOut);
        }

        // ---------- drawLine ----------
        function testDrawLine() {
            section('Rasterizer.drawLine');

            var fb = new FrameBuffer();
            fb.resize(30, 10);
            fb.clear();

            Rasterizer.drawLine(fb, { x: 5, y: 5, invW: 0.2 }, { x: 25, y: 5, invW: 0.2 }, '@');
            assertTrue('horizontal line drawn at start', fb.getChar(5, 5) === '@');
            assertTrue('horizontal line drawn at end', fb.getChar(25, 5) === '@');
            assertTrue('horizontal line drawn in middle', fb.getChar(15, 5) === '@');

            var fb2 = new FrameBuffer();
            fb2.resize(30, 10);
            fb2.clear();
            Rasterizer.drawLine(fb2, { x: 10, y: 2, invW: 0.2 }, { x: 10, y: 8, invW: 0.2 }, '@');
            assertTrue('vertical line drawn', fb2.getChar(10, 5) === '@');
        }

        // ---------- Full scene render (smoke test) ----------
        function testSceneRender() {
            section('Rasterizer.render (scene smoke)');

            var cam = makeTestCamera();
            cam.position = new Vec3(0, 2, 10);
            cam.yaw = 0;
            cam.pitch = 0;   // look straight ahead so the sphere is centered
            cam.aspect = 2;

            var scene = new Scene({ name: 'test' });
            // ground plane at y=0 (fills the lower part of the view)
            var ground = new Plane({ segments: 4, size: 40 });
            scene.add(ground);
            // sphere in front of and slightly below the camera -> centered in view
            var Sphere = A3D.modules.Sphere;
            var orb = new Sphere({ rings: 6, segments: 8 });
            orb.position = new Vec3(0, 1.5, 4);
            orb.scale = new Vec3(1.5, 1.5, 1.5);
            orb.markDirty();
            scene.add(orb);

            scene.update(0);
            scene.assignMeshIds();

            var fb = new FrameBuffer();
            fb.resize(80, 40);
            fb.clear();

            var view = cam.getViewMatrix();
            var proj = cam.getProjectionMatrix();
            var aspect = 2.0; // cellH / cellW

            Rasterizer.render(scene, cam, fb, view, proj, aspect);

            // count non-space cells
            var filled = 0;
            for (var i = 0; i < fb.chars.length; i++) {
                if (fb.chars[i] !== ' ') filled++;
            }
            assertTrue('scene produced visible cells (' + filled + ')', filled > 50, 'too few: ' + filled);

            // the image should have edge chars (outlines, GlyphMap.edge)
            var hasEdge = false;
            for (var j = 0; j < fb.chars.length; j++) {
                if (fb.chars[j] === '@') hasEdge = true;
            }
            assertTrue('edge glyph present', hasEdge);

            // без источников света глиф полигона = byIntensity(AMBIENT) = '.' —
            // градиент символов по освещению (этап B). Проверяем, что заполненные
            // ячейки используют glyphs из RAMP, а не только константу '#'.
            var hasRampPoly = false;
            for (var j2 = 0; j2 < fb.chars.length; j2++) {
                var ch2 = fb.chars[j2];
                if (ch2 !== ' ' && ch2 !== '@' && A3D.modules.GlyphMap.RAMP.indexOf(ch2) !== -1) {
                    hasRampPoly = true;
                    break;
                }
            }
            assertTrue('polygon glyphs come from RAMP (lighting)', hasRampPoly);

            // sphere is in front of ground -> the buffer must contain more than
            // one glyph kind (depth / occlusion actually did something).
            var distinct = {};
            for (var k = 0; k < fb.chars.length; k++) {
                distinct[fb.chars[k]] = (distinct[fb.chars[k]] || 0) + 1;
            }
            var kinds = Object.keys(distinct).length;
            assertTrue('multiple glyph kinds present (' + kinds + ')', kinds >= 2);

            // per-mesh colors: rendered cells carry the mesh id of whatever
            // filled them (the ground plane is edge-on/behind from this camera,
            // so only the orb's cells are visible here)
            var idSet = {};
            for (var m = 0; m < fb.ids.length; m++) {
                if (fb.chars[m] !== ' ') idSet[fb.ids[m]] = true;
            }
            assertTrue('rendered cells carry mesh ids (' + Object.keys(idSet).length + ')', Object.keys(idSet).length >= 1);

            var palette = ['#0f0', '#ff0'];
            var flushOk = true;
            try {
                fb.flush(document.createElement('canvas').getContext('2d'), 10, 20, palette);
            } catch (e) {
                flushOk = false;
            }
            assertTrue('flush with palette does not throw', flushOk);

            // the sphere is centered horizontally; with FOV 70 + aspect-2 cells it
            // lands in the lower half of this small buffer, so check a horizontal
            // band across the middle column on the lower half.
            var cx = Math.floor(fb.width / 2);
            var hasCenterBand = false;
            for (var yy = Math.floor(fb.height * 0.6); yy < fb.height; yy++) {
                if (fb.getChar(cx, yy) !== ' ') hasCenterBand = true;
            }
            assertTrue('something rendered in the center column (lower half)', hasCenterBand);
        }

        // ---------- Lighting (этап B) ----------
        function testLighting() {
            section('Lighting');

            // normalizeLight: valid point light
            var pl = Lighting.normalizeLight({ type: 'point', color: [1, 0.5, 0], intensity: 2, position: [3, 4, 5] });
            assertTrue('normalizeLight point ok', !!pl && pl.type === 'point');
            if (pl) {
                assertClose('point intensity kept', pl.intensity, 2);
                assertTrue('point position is Vec3', pl.position instanceof Vec3);
                assertClose('point position x', pl.position.x, 3);
                assertClose('point color[1]', pl.color[1], 0.5);
            }

            // normalizeLight: valid directional light (direction normalized)
            var dl = Lighting.normalizeLight({ type: 'directional', color: [0.2, 0.4, 0.6], intensity: 0.8, direction: [0, -10, 0] });
            assertTrue('normalizeLight directional ok', !!dl && dl.type === 'directional');
            if (dl) {
                assertClose('direction normalized y', dl.direction.y, -1);
                assertClose('direction normalized x', dl.direction.x, 0);
            }

            // normalizeLight: bad inputs -> null
            assertTrue('bad type -> null', Lighting.normalizeLight({ type: 'spot' }) === null);
            assertTrue('missing color -> null', Lighting.normalizeLight({ type: 'point', position: [1, 2, 3] }) === null);
            assertTrue('point w/o position -> null', Lighting.normalizeLight({ type: 'point', color: [1, 1, 1] }) === null);
            assertTrue('directional w/o direction -> null', Lighting.normalizeLight({ type: 'directional', color: [1, 1, 1] }) === null);
            assertTrue('garbage -> null', Lighting.normalizeLight(null) === null);

            // computeFaceLight: no lights -> ambient only (0.1 white)
            var n = new Vec3(0, 1, 0);
            var p = new Vec3(0, 0, 0);
            var amb = Lighting.computeFaceLight(n, p, []);
            assertClose('no lights r = ambient', amb.r, Config.AMBIENT, 1e-5);
            assertClose('no lights g = ambient', amb.g, Config.AMBIENT, 1e-5);
            assertClose('no lights b = ambient', amb.b, Config.AMBIENT, 1e-5);

            // directional: top face (normal +y) lit by light shining straight down
            var sunDown = [Lighting.normalizeLight({ type: 'directional', color: [1, 1, 1], intensity: 1, direction: [0, -1, 0] })];
            var topLit = Lighting.computeFaceLight(new Vec3(0, 1, 0), p, sunDown);
            assertTrue('top face fully lit (r=1)', Math.abs(topLit.r - 1) < 1e-5, 'got ' + topLit.r);
            // bottom face (normal -y) points away -> ambient only
            var botUnlit = Lighting.computeFaceLight(new Vec3(0, -1, 0), p, sunDown);
            assertClose('bottom face ambient only', botUnlit.r, Config.AMBIENT, 1e-5);

            // directional: 45-degree face -> Lambert ~0.707 (unsaturated model:
            // ambient + dot(normal, toLight), clamp 0..1 — см. FEATURES_PLAN §1.1)
            var diag = Lighting.computeFaceLight(new Vec3(Math.SQRT1_2, Math.SQRT1_2, 0), p, sunDown);
            assertClose('45deg face Lambert (ambient + 0.707)',
                diag.r, Config.AMBIENT + Math.SQRT1_2, 1e-4);

            // colored light: contribution is scaled by light color
            var redLight = [Lighting.normalizeLight({ type: 'directional', color: [1, 0, 0], intensity: 1, direction: [0, -1, 0] })];
            var redTop = Lighting.computeFaceLight(new Vec3(0, 1, 0), p, redLight);
            assertClose('red light r ~1', redTop.r, 1, 1e-5);
            assertClose('red light g = ambient', redTop.g, Config.AMBIENT, 1e-5);

            // point light: directly below the light, normal up -> full contribution
            var plight = [Lighting.normalizeLight({ type: 'point', color: [1, 1, 1], intensity: 1, position: [0, 3, 0] })];
            var underPoint = Lighting.computeFaceLight(new Vec3(0, 1, 0), new Vec3(0, 0, 0), plight);
            var expAtt = 1 / (1 + Config.POINT_ATTENUATION_K * 9); // d=3
            assertClose('point directly above: ambient + att(3)', underPoint.r, Config.AMBIENT + expAtt, 1e-4);

            // attenuation grows with distance: face at d=6 is darker than at d=3
            var farPoint = Lighting.computeFaceLight(new Vec3(0, 1, 0), new Vec3(0, -3, 0), plight);
            assertTrue('point attenuates with distance', farPoint.r < underPoint.r,
                'far=' + farPoint.r + ' near=' + underPoint.r);

            // point light behind the face (normal away) -> ambient only
            var behind = Lighting.computeFaceLight(new Vec3(0, 1, 0), new Vec3(0, 3, 0), plight);
            assertClose('point behind face: ambient only', behind.r, Config.AMBIENT, 1e-5);

            // two lights add up (clamped to 1)
            var both = Lighting.computeFaceLight(new Vec3(0, 1, 0), p, sunDown.concat(plight));
            assertTrue('two lights brighter than one', both.r > topLit.r - 1e-6 && both.r <= 1 + 1e-6, 'got ' + both.r);

            // luminance: white -> 1, black -> 0, red -> ~0.3
            assertClose('luminance(white) = 1', Lighting.luminance({ r: 1, g: 1, b: 1 }), 1, 1e-5);
            assertClose('luminance(black) = 0', Lighting.luminance({ r: 0, g: 0, b: 0 }), 0, 1e-5);
            assertClose('luminance(red) ~ 0.3', Lighting.luminance({ r: 1, g: 0, b: 0 }), 0.3, 1e-5);

            // ambient=0.1 gives a dark but visible glyph (RAMP index 1 = '.')
            var GlyphMap = A3D.modules.GlyphMap;
            assertClose('ambient luminance ~0.1', Lighting.luminance(amb), Config.AMBIENT, 1e-5);
            assertTrue('ambient-only glyph is dim but not empty',
                GlyphMap.byIntensity(Lighting.luminance(amb)) !== GlyphMap.RAMP[0],
                'got ' + JSON.stringify(GlyphMap.byIntensity(Lighting.luminance(amb))));

            // attenuation() helper: monotone decreasing, =1 at d=0
            assertTrue('attenuation(0) = 1', Math.abs(Lighting.attenuation(0) - 1) < 1e-6);
            assertTrue('attenuation decreases', Lighting.attenuation(5) < Lighting.attenuation(1));
        }

        // ---------- Texture (этап C) ----------
        function testTexture() {
            section('Texture');

            // define + get
            var tex = Texture.define('test4x4', 4, 4, [
                '#...',
                '.#..',
                '..#.',
                '...#'
            ]);
            assertTrue('define returns texture', !!tex && tex.w === 4 && tex.h === 4);
            var got = Texture.get('test4x4');
            assertTrue('get returns defined texture', got === tex);
            assertTrue('get unknown -> null', Texture.get('nope') === null);

            // sample: corners (clamp) and center
            // diagonal texture: cell (0,0)='#'(int~1), (3,3)='#'(int~1), others '.'(int~0.1)
            var c00 = Texture.sample(tex, 0, 0);
            var c33 = Texture.sample(tex, 1, 1);
            assertTrue('sample(0,0) high (corner #)', c00 > 0.5, 'got ' + c00);
            assertTrue('sample(1,1) high (corner #)', c33 > 0.5, 'got ' + c33);
            // center of texture (u=0.5, v=0.5) → between cells, lower intensity
            var cMid = Texture.sample(tex, 0.5, 0.5);
            assertTrue('sample(0.5,0.5) finite', isFinite(cMid));
            assertTrue('sample(0.5,0.5) in [0,1]', cMid >= 0 && cMid <= 1, 'got ' + cMid);

            // clamp: out-of-range u/v clamps to [0,1]
            var cNeg = Texture.sample(tex, -0.5, -0.5);
            var cOver = Texture.sample(tex, 1.5, 1.5);
            assertTrue('sample clamps negative', isFinite(cNeg) && cNeg >= 0 && cNeg <= 1);
            assertTrue('sample clamps >1', isFinite(cOver) && cOver >= 0 && cOver <= 1);

            // bilinear: sample at exact pixel center should match that cell
            // cell (0,0) center is at u = 0.5/4 = 0.125, v = 0.5/4 = 0.125
            var cPx = Texture.sample(tex, 0.125, 0.125);
            assertTrue('sample at pixel (0,0) center ~ # intensity', cPx > 0.7, 'got ' + cPx);

            // built-in textures exist
            assertTrue('built-in brick exists', !!Texture.get('brick'));
            assertTrue('built-in grass exists', !!Texture.get('grass'));
            assertTrue('built-in checker exists', !!Texture.get('checker'));

            // glyphIntensity: '#' is high (index 7/9 in RAMP_ORDER), '.' is low, ' ' is 0
            assertTrue('glyphIntensity(#) > 0.5', Texture.glyphIntensity('#') > 0.5, 'got ' + Texture.glyphIntensity('#'));
            assertTrue('glyphIntensity(@) = 1 (last in ramp)', Math.abs(Texture.glyphIntensity('@') - 1) < 1e-6);
            assertTrue('glyphIntensity(.) < glyphIntensity(#)', Texture.glyphIntensity('.') < Texture.glyphIntensity('#'));
            assertClose('glyphIntensity(space) = 0', Texture.glyphIntensity(' '), 0, 1e-6);

            // uvForFaceGroup: cube groups
            var cg = Texture.uvForFaceGroup('cube', 'front');
            assertTrue('uvForFaceGroup cube front', !!cg && cg.faceIndices && cg.faceIndices.length === 2);
            var cgTop = Texture.uvForFaceGroup('cube', 'top');
            assertTrue('uvForFaceGroup cube top', !!cgTop && cgTop.faceIndices[0] === 8);
            assertTrue('uvForFaceGroup cube bad group -> null', Texture.uvForFaceGroup('cube', 'nope') === null);
            var pg = Texture.uvForFaceGroup('pyramid', 'bottom');
            assertTrue('uvForFaceGroup pyramid bottom', !!pg && pg.faceIndices.length === 1);

            // ---------- fillPoly with texture: per-cell glyph from texture ----------
            var fbT = new FrameBuffer();
            fbT.resize(40, 20);
            fbT.clear();
            // triangle covering center; UVs mapping the texture across it
            var triPts = [
                { x: 10, y: 5, invW: 0.2, u: 0, v: 0 },
                { x: 30, y: 5, invW: 0.2, u: 1, v: 0 },
                { x: 20, y: 15, invW: 0.2, u: 0.5, v: 1 }
            ];
            var triUVs = [0, 0, 1, 0, 0.5, 1];
            // use a high-contrast texture so glyphs vary
            var contrastTex = Texture.define('contrast', 2, 2, ['#.', '.#']);
            Rasterizer.fillPoly(fbT, triPts, 'Z', 0, triUVs, null, contrastTex);
            // count distinct non-space glyphs inside the triangle region
            var distinctT = {};
            for (var ti = 0; ti < fbT.chars.length; ti++) {
                if (fbT.chars[ti] !== ' ') distinctT[fbT.chars[ti]] = true;
            }
            var kindsT = Object.keys(distinctT).length;
            assertTrue('textured fillPoly produces varied glyphs (' + kindsT + ')', kindsT >= 2, JSON.stringify(distinctT));

            // perspective correction: with varying invW, the UV at the centroid
            // must differ from naive screen-space average (1/w weighting matters).
            var perspPts = [
                { x: 10, y: 5, invW: 0.2, u: 0, v: 0 },
                { x: 30, y: 5, invW: 0.4, u: 1, v: 0 },
                { x: 20, y: 15, invW: 0.6, u: 0.5, v: 1 }
            ];
            var perspUVs = [0, 0, 1, 0, 0.5, 1];
            var pGrads = Rasterizer.buildUVGradients(perspPts, perspUVs);
            var pInvW = Rasterizer.computeInvWGradient(perspPts);
            // screen-space centroid
            var scx = (perspPts[0].x + perspPts[1].x + perspPts[2].x) / 3;
            var scy = (perspPts[0].y + perspPts[1].y + perspPts[2].y) / 3;
            var pcUV = Rasterizer.sampleUV(pGrads, pInvW, scx, scy);
            assertTrue('perspective sampleUV at centroid not null', !!pcUV);
            if (pcUV) {
                // naive screen-space average of corner UVs
                var naiveU = (0 + 1 + 0.5) / 3;
                var naiveV = (0 + 0 + 1) / 3;
                // perspective-correct should differ from naive when invW varies
                assertTrue('perspective u differs from naive', Math.abs(pcUV.u - naiveU) > 1e-4, 'pc=' + pcUV.u + ' naive=' + naiveU);
            }

            // ---------- primitive UV generation (этап C) ----------
            // UV генерируется лениво через Texture.generateFaceUVs (Texture.js
            // грузится после примитивов — см. index.html).
            var cube = new Cube();
            Texture.generateFaceUVs(cube);
            assertTrue('cube faces have uv', cube.faces[0].uv && cube.faces[0].uv.length === 6);
            var allUV = true;
            for (var ci = 0; ci < cube.faces.length; ci++) {
                if (!cube.faces[ci].uv || cube.faces[ci].uv.length !== 6) { allUV = false; break; }
            }
            assertTrue('all cube faces have uv', allUV);

            var plane = new Plane({ segments: 4, size: 10 });
            Texture.generateFaceUVs(plane);
            assertTrue('plane faces have uv', plane.faces[0].uv && plane.faces[0].uv.length === 6);

            var pyr = new Pyramid();
            Texture.generateFaceUVs(pyr);
            assertTrue('pyramid faces have uv', pyr.faces[0].uv && pyr.faces[0].uv.length === 6);

            var sph = A3D.modules.Sphere;
            var sphere = new sph({ rings: 6, segments: 8 });
            Texture.generateFaceUVs(sphere);
            assertTrue('sphere faces have uv', sphere.faces[0].uv && sphere.faces[0].uv.length === 6);

            // face groups (computeFaceGroups)
            var cubeGroups = cube.computeFaceGroups();
            assertTrue('cube has front group', Array.isArray(cubeGroups.front) && cubeGroups.front.length === 2);
            assertTrue('cube has top group', Array.isArray(cubeGroups.top) && cubeGroups.top.length === 2);
            assertTrue('cube has back group', Array.isArray(cubeGroups.back) && cubeGroups.back.length === 2);

            // getFaceTextureName: material.texture applies to all faces
            var cubeT = new Cube({ material: { texture: 'brick' } });
            assertTrue('material.texture -> face name', cubeT.getFaceTextureName(cubeT.faces[0]) === 'brick');
            // per-group textures override
            var cubeG = new Cube({ material: { texture: 'grass', textures: { front: 'window' } } });
            assertTrue('per-group overrides', cubeG.getFaceTextureName(cubeG.faces[4]) === 'window'); // front is face 4
            assertTrue('non-overridden uses default', cubeG.getFaceTextureName(cubeG.faces[0]) === 'grass');
        }

        testClipNear();
        testProjectFace();
        testProjectEdge();
        testRasterizer();
        testDrawLine();
        testLighting();
        testTexture();
        testSceneRender();

        var summary = document.createElement('div');
        summary.className = 'summary';
        if (failed === 0) {
            summary.style.color = '#0f0';
            summary.textContent = '✓ ALL TESTS PASSED: ' + passed + ' passed, 0 failed';
            console.log('%cA3D STAGE-5 TESTS: ALL PASSED (' + passed + ')', 'color: #0f0; font-size: 16px;');
        } else {
            summary.style.color = '#f44';
            summary.textContent = '✗ TESTS FAILED: ' + passed + ' passed, ' + failed + ' failed';
            console.error('A3D STAGE-5 TESTS: ' + failed + ' failed, ' + passed + ' passed');
        }
        output.appendChild(summary);
    })();
    </script>
